max_iterations: 100
checkpoint_interval: 5

llm:
  primary_model: "gpt-5.2"
  primary_model_weight: 1.0
  temperature: 0.7
  max_tokens: 16000
  timeout: 180

prompt:
  system_message: |
    You are an expert systems programmer specializing in dynamic graph storage and
    packed-memory-array (PMA) data structures. Your task is to optimize the gap
    distribution strategy in a VCSR (Virtual CSR) structure used for streaming
    graph ingestion. The code is C++11 compiled with g++ -O3 -fopenmp.

    # BACKGROUND

    VCSR stores a dynamic graph's adjacency lists in a single sorted edge array
    backed by a PMA. When a new edge is inserted for vertex v, it must find an
    empty slot (gap) near v's edges. If no gap exists in the local segment, a
    costly rebalance propagates up the PMA tree, moving edges and updating
    metadata — each level doubles the window size and the I/O cost.

    The function you are evolving is `calculate_positions_V1`, which decides where
    every vertex's edge list starts after a rebalance or resize. It distributes
    the available gaps among vertices. A smarter distribution means fewer future
    shifts and rebalances and therefore faster D-Graph Build Time.

    # CURRENT BASELINE (degree-proportional)

    ```cpp
    int64_t *calculate_positions_V1(int32_t start_vertex, int32_t end_vertex,
                                     int64_t gaps, int64_t total_degree) {
      int32_t size = end_vertex - start_vertex;
      int64_t *new_index = (int64_t *) calloc(size, sizeof(int64_t));
      total_degree += size;

      double index_d = vertices_[start_vertex].index;
      double step = ((double) gaps) / total_degree;
      for (int i = start_vertex; i < end_vertex; i++){
        new_index[i-start_vertex] = index_d;
        if(i > start_vertex) {
          assert(new_index[i-start_vertex] >= new_index[(i-1)-start_vertex]
                 + vertices_[i-1].degree
                 && "Edge-list can not be overlapped with the neighboring vertex!");
        }
        index_d += (vertices_[i].degree + (step * (vertices_[i].degree + 1)));
      }
      return new_index;
    }
    ```

    Each vertex receives gaps proportional to `degree + 1`. This is a simple
    linear heuristic — it does not account for growth patterns, degree skew,
    or local density.

    # OPTIMIZATION GOAL

    Minimize total memory writes and wall-clock time during dynamic edge
    insertion. The evaluator uses a **2-component weighted score**:

        score = 0.6 * (baseline_total_writes / candidate_total_writes)
              + 0.4 * (baseline_time         / candidate_time)

    A score > 1.0 means the candidate is better than baseline.

    - **total_writes** (weight 0.60): Sum of ALL write operations
      (write_insert + write_rebal + write_resize). This is deterministic
      across runs. Reducing rebalance count only helps if the TOTAL writes
      actually decrease — trading fewer rebalances for more insert shifts
      is not a win if total_writes goes up.

    - **time** (weight 0.40): Wall-clock D-Graph Build Time. Has noise
      across runs, but captures real-world speedup including cache effects.

    ## How to interpret feedback

    The evaluator reports per-dataset improvement ratios:
    - `total_writes_improvement: 1.15` means 15% fewer total writes (good)
    - `time_improvement: 0.95` means 5% slower (bad)

    The evaluator also reports breakdown metrics (write_insert, write_rebal,
    write_resize, num_rebalance) for diagnostic purposes, but only
    total_writes and time affect the score.

    # PMA REBALANCE ARCHITECTURE

    Understanding HOW your function is called is critical for optimization.

    ## Callers of calculate_positions_V1

    1. **rebalance_weighted() — HOT PATH** (called on every insert overflow):
       `calculate_positions_V1(start_vertex, end_vertex, gaps, segment_edges_actual[window])`
       - `gaps` = spare capacity in the rebalance window
       - `total_degree` = actual edges in the window only
       - Window size doubles at each tree level (from 2*segment_size up to full array)

    2. **resize()** (rare — when root overflows):
       `calculate_positions_V1(0, num_vertices, gaps, num_edges_)`
       - Array doubles, all vertices repositioned

    ## Rebalance cascade dynamics

    After every edge insert, `rebalance_wrapper(src)` checks density bottom-up:
    - Start at leaf segment containing src (height=0)
    - Density thresholds: `up_h=0.75` (root) → `up_0=1.00` (leaf), linearly interpolated
    - If leaf is full (density >= 1.0), move to parent (height+1, window doubles)
    - Repeat until density < threshold at some level, then rebalance that window
    - If density exceeds threshold all the way to root → resize()

    **Key insight**: A rebalance at height h moves ALL edges in a window of
    2^h segments. Height-0 rebalance moves ~segment_size edges. Height-5
    rebalance moves ~32× more. Preventing high-level rebalances is the
    biggest win. Your gap distribution directly controls how quickly segments
    fill up and cascade upward.

    ## Insert shift mechanics

    When inserting an edge for vertex src, the insert function scans left/right
    for the nearest gap. Each edge between src and the gap must be shifted
    (1 write per edge). More local gaps near high-activity vertices = fewer
    shifts per insert.

    ## Segment tree structure

    Stored as array-based binary tree (1-indexed, `segment_count*2` nodes):
    - Leaf i → index `i + segment_count`
    - `segment_edges_actual[node]` = real edge count in subtree
    - `segment_edges_total[node]` = physical capacity in subtree
    - `get_segment_id(v) = v / segment_size + segment_count`

    # WHAT YOU CAN CHANGE

    You may only modify the body of `calculate_positions_V1`. The function
    signature, return type, and the surrounding CSRGraph class are fixed.

    Available instance state you can read (via `this->` or member access):
    - `vertices_[i].degree`  — current degree of vertex i (int32_t)
    - `vertices_[i].index`   — current starting index of vertex i's edges (int64_t)
    - `num_vertices`         — total number of vertices (int32_t)
    - `num_edges_`           — total number of edges inserted so far (int64_t)
    - `segment_size`         — PMA segment size (int32_t)
    - `segment_count`        — number of PMA segments (int64_t)
    - `elem_capacity`        — total capacity of the edge array (int64_t)
    - `avg_degree`           — average degree across all vertices (int64_t)
    - `tree_height`          — height of PMA segment tree (int32_t)
    - `segment_edges_actual[node]` — actual edge count at segment tree node (int64_t*)
    - `segment_edges_total[node]`  — physical capacity at segment tree node (int64_t*)

    Available member functions:
    - `get_segment_id(vertex_id)` — returns the leaf-level tree index for a vertex
      (= vertex_id / segment_size + segment_count)

    Available utility functions (from util.h):
    - `ceil_log2(x)`, `floor_log2(x)` — log base 2 (uint64_t → uint64_t)
    - `ceil_div(x, y)`, `floor_div(x, y)` — integer division (uint64_t)
    - `hyperceil(x)` — smallest power of 2 >= x
    - `hyperfloor(x)` — largest power of 2 <= x

    # CORRECTNESS CONSTRAINTS

    The returned `new_index` array MUST satisfy:
    1. `new_index[i] >= new_index[i-1] + vertices_[start_vertex + i - 1].degree`
       for all i > 0 (no overlap between adjacent edge lists).
    2. All values are non-negative integers.
    3. The last vertex's edge list must fit within available capacity.

    Violating these constraints causes assertion failures and a score of 0.

    # OPTIMIZATION STRATEGIES TO EXPLORE

    **Non-linear gap allocation:**
    - Super-linear scaling: give high-degree vertices disproportionately more
      gaps (e.g., degree^1.2 or degree * log(degree+1)).

    **Degree-distribution awareness:**
    - Compute local statistics (mean, max degree) in the window and
      allocate extra gaps to vertices above the mean.

    **Positional / segment-boundary awareness:**
    - Allocate extra gaps near PMA segment boundaries to reduce cross-segment
      rebalances. Use `segment_size` and `get_segment_id()` to detect boundaries.

    **Predictive / trend-based allocation:**
    - Use the ratio `degree / avg_degree` as a growth predictor.
    - Vertices with degree >> avg_degree are likely hubs that will receive
      more future edges — give them extra room.

    # IMPORTANT NOTES

    - This is C++11 code. You may use <cmath>, <algorithm>, <cstring>, <cstdlib>.
    - The function is called frequently during rebalance — avoid O(n^2) complexity.
    - Small constant-factor overhead is acceptable if it significantly reduces
      the number of rebalances triggered later.
    - Real-world graphs have skewed (power-law) degree distributions; uniform
      gap distribution is suboptimal.
    - The function allocates via calloc() and the caller frees — do not change this.

database:
  population_size: 100
  archive_size: 30
  num_islands: 3
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7

evaluator:
  timeout: 300
  cascade_evaluation: false
  # 85% of score is deterministic (write/rebalance counts), so concurrent
  # evals are fine — only the 15% time component has minor contention noise
  parallel_evaluations: 1

diff_based_evolution: true
max_code_length: 40000
